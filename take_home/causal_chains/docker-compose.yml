services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-causal_chains}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-causal_chains}
      POSTGRES_DB: ${POSTGRES_DB:-causal_chains}
    ports:
      - "5432:5432"
    volumes:
      - causal_chains_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-causal_chains} -d ${POSTGRES_DB:-causal_chains}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: ../../..
      dockerfile: take_home/causal_chains/agents/Dockerfile
    command: ["python", "take_home/causal_chains/agents/main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - agents

  graph:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/causal_chains}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - causal_chains_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p causal_chains 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  graph_init:
    image: neo4j:5-community
    depends_on:
      graph:
        condition: service_healthy
    restart: "no"
    entrypoint: ["cypher-shell", "-a", "bolt://graph:7687", "-u", "neo4j", "-p", "causal_chains", "-f", "/init.cypher"]
    volumes:
      - ./db/neo4j/init.cypher:/init.cypher:ro

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    environment:
      # Latest DynamoDB Local binds IPv6-only, so other containers time out on dynamodb:8000.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  causal_chains_pg:
  causal_chains_neo4j:
