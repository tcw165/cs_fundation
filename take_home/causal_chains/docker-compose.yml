services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-causal_chains}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-causal_chains}
      POSTGRES_DB: ${POSTGRES_DB:-causal_chains}
    ports:
      - "5432:5432"
    volumes:
      - causal_chains_pg:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-causal_chains} -d ${POSTGRES_DB:-causal_chains}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: ../..
      dockerfile: take_home/causal_chains/agents/Dockerfile
    command: ["python", "take_home/causal_chains/agents/main.py", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DYNAMODB_ENDPOINT_URL: http://dynamodb:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAINTRUST_API_KEY: ${BRAINTRUST_API_KEY:-}
      BRAINTRUST_PROJECT_ID: ${BRAINTRUST_PROJECT_ID:-}
      BRAINTRUST_ORGANIZATION_NAME: ${BRAINTRUST_ORGANIZATION_NAME:-}
    ports:
      - "8000:8000"
    depends_on:
      dynamodb_init:
        condition: service_completed_successfully
      graph_init:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - agents

  graph:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/causal_chains}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - causal_chains_neo4j:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p causal_chains 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  graph_init:
    image: neo4j:5-community
    depends_on:
      graph:
        condition: service_healthy
    restart: "no"
    entrypoint: ["cypher-shell", "-a", "bolt://graph:7687", "-u", "neo4j", "-p", "causal_chains", "-f", "/init.cypher"]
    volumes:
      - ./db/neo4j/init.cypher:/init.cypher:ro

  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    environment:
      # Latest DynamoDB Local binds IPv6-only, so other containers time out on dynamodb:8000.
      JAVA_TOOL_OPTIONS: "-Djava.net.preferIPv4Stack=true"
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/8000'"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb_init:
    image: amazon/aws-cli:latest
    depends_on:
      dynamodb:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: dummy
      AWS_SECRET_ACCESS_KEY: dummy
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name conversation \
          --attribute-definitions \
            AttributeName=PK,AttributeType=S \
            AttributeName=SK,AttributeType=S \
            AttributeName=conversation_user_uuid,AttributeType=S \
            AttributeName=created_at,AttributeType=S \
          --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
          --global-secondary-indexes \
            'IndexName=conversation_user_uuid,KeySchema=[{AttributeName=conversation_user_uuid,KeyType=HASH},{AttributeName=created_at,KeyType=RANGE}],Projection={ProjectionType=ALL}' \
          --billing-mode PAY_PER_REQUEST
        aws dynamodb create-table --endpoint-url http://dynamodb:8000 \
          --table-name turn \
          --attribute-definitions \
            AttributeName=turn_id,AttributeType=S \
            AttributeName=conversation_id,AttributeType=S \
          --key-schema AttributeName=turn_id,KeyType=HASH \
          --global-secondary-indexes \
            'IndexName=conversation_id,KeySchema=[{AttributeName=conversation_id,KeyType=HASH}],Projection={ProjectionType=ALL}' \
          --billing-mode PAY_PER_REQUEST
        aws dynamodb update-table --endpoint-url http://dynamodb:8000 \
          --table-name turn \
          --attribute-definitions AttributeName=conversation_id,AttributeType=S \
          --global-secondary-index-updates \
            '[{"Create":{"IndexName":"conversation_id","KeySchema":[{"AttributeName":"conversation_id","KeyType":"HASH"}],"Projection":{"ProjectionType":"ALL"}}}]' \
          || true
        aws dynamodb update-time-to-live --endpoint-url http://dynamodb:8000 \
          --table-name conversation \
          --time-to-live-specification "Enabled=true, AttributeName=time_to_live"
        aws dynamodb update-time-to-live --endpoint-url http://dynamodb:8000 \
          --table-name turn \
          --time-to-live-specification "Enabled=true, AttributeName=ttl"
        aws dynamodb put-item --endpoint-url http://dynamodb:8000 \
          --table-name conversation \
          --item '{"PK":{"S":"CONV#1"},"SK":{"S":"METADATA"},"user_uuid":{"S":"user-1"},"conversation_user_uuid":{"S":"user-1"},"conversation_id":{"S":"1"},"status":{"S":"OPEN"},"created_at":{"S":"2026-09-30T00:00:00+00:00"},"schema_version":{"N":"1"},"conversation_json":{"M":{"id":{"S":"1"},"user_uuid":{"S":"user-1"},"title":{"S":""},"status":{"S":"OPEN"},"followup_questions":{"L":[]},"entry_context":{"M":{"kind":{"S":"my_blog"},"source_url":{"S":""},"source_ip":{"S":""}}},"created_at":{"S":"2026-09-30T00:00:00+00:00"}}}}'

volumes:
  causal_chains_pg:
  causal_chains_neo4j:
